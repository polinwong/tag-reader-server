<!DOCTYPE html>
<html>
<!--
    WARNING! Make sure that you match all Quasar related
    tags to the same version! (Below it's "@2.1.0")
  -->

<head>
  <meta name=format-detection content="telephone=no"><meta name=msapplication-tap-highlight content=no><meta name=viewport content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width">
  <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet"
    type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/quasar@2.1.0/dist/quasar.prod.css" rel="stylesheet" type="text/css">
  <link href="/verify/js/verify.css" rel="stylesheet" type="text/css">
  <title>NFC Verification</title>
</head>

<body>
  <!-- example of injection point where you write your app template -->
  <div id="q-app"></div>

  <!-- Add the following at the end of your body tag -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.26/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quasar@2.4.3/dist/quasar.umd.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.0.12/dist/vue-router.global.prod.js"></script>
  <script src="https://unpkg.com/vue-i18n@9.1.9/dist/vue-i18n.global.prod.js"></script>
  <script src="https://unpkg.com/axios@0.24.0/dist/axios.min.js"></script>
  <script src="/verify/js/html5-qrcode.min.js"></script>
  <script src="/verify/js/verify-aiscan.js"></script>
  <script src="/verify/js/verify-base.js"></script>
  <script src="/verify/js/verify-i18n.js"></script>

  <script>
    /*
      Example kicking off the UI. Obviously, adapt this to your specific needs.
      Assumes you have a <div id="q-app"></div> in your <body> above
      */
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory("/verify/sun/"),
      routes,
    })

    var inputData = {{.dataresult}};
    var linkId = {{.dataid}};

    // Create VueI18n instance with options
    const i18n = VueI18n.createI18n({
      locale: 'en', // set locale
      fallbackLocale:{ // set fallback locale
        'zh-HK': ['zh-TW'],
        'zh-Hant-HK': ['zh-TW'],
        'default': ['en']
      },
      messages, // set locale messages
    })
     i18n.global.locale = navigator.language;

    const app = Vue.createApp(Index)

    addComponent()

    app.use(router)
    app.use(i18n)
    app.use(Quasar, {
      config: {
        brand: {
          primary: '#e86c0a',
          secondary: '#e0d1c2',
          accent: '#ffb366',

          dark: '#1d1d1d',

          positive: '#26eb26',
          negative: '#f0263e',
          info: '#31b8d4',
          warning: '#f2c037'
        }
      }
    })
    app.mount('#q-app')
  </script>
</body>

</html>
